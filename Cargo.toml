[package]
authors = [ "Antares" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Gramática Tree-sitter para Lenguaje Quetzal"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "quetzal" ]
license = "MIT"
name = "tree-sitter-quetzal"
readme = "README.md"
repository = "https://github.com/AntaresGT/tree-sitter-quetzal"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*.c", "src/*.json", "src/tree_sitter/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.1"
